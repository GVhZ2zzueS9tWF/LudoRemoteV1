name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Helper APK
        run: gradle -p Helper assembleDebug

      - name: Build Controller APK
        run: gradle -p Controller assembleDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: LudoRemoteV1-debug-apks
          path: |
            Helper/app/build/outputs/apk/debug/*.apk
            Controller/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14



